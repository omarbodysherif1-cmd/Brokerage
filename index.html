<style>
@import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;900&display=swap');

:root{
  --ink:#0C1C17; --panel:#102620; --panel-2:#0E2019; --line:#224134; --line-soft:#1A332A;
  --gold:#E6B45A; --gold-deep:#C9923B; --mint:#5FD6A0; --teal:#6FB3C9;
  --text:#F2EFE5; --muted:#86A096; --danger:#E07A6B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--ink);}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(125% 45% at 50% -12%, rgba(230,180,90,.16), transparent 60%),var(--ink);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;padding:20px 15px 96px;}
#screen{animation:fade .25s ease;}
@keyframes fade{from{opacity:.3;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* headers */
.scr-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;}
.scr-title{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;font-size:22px;}
.scr-sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;}
.add{background:var(--gold);color:#1a1207;border:none;border-radius:11px;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-weight:700;font-size:13px;padding:9px 15px;cursor:pointer;transition:.2s;}
.add:hover{background:#f0c46e;}

/* hero */
.eyebrow{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.4px;color:var(--gold);text-align:center;opacity:.9;}
.eyebrow span{color:var(--muted);}
.bignum{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:700;font-size:clamp(46px,15vw,64px);line-height:1;text-align:center;color:var(--gold);margin-top:12px;letter-spacing:-1px;font-variant-numeric:tabular-nums;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.bignum.pulse{transform:scale(1.06);}
.bignum .cur{font-size:.4em;color:var(--muted);font-weight:400;margin-inline-start:6px;}
.goalline{text-align:center;color:var(--muted);font-size:13.5px;margin-top:6px;font-weight:500;}
.goalline b{color:var(--text);font-weight:700;}
.editbtn{display:block;margin:9px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:11.5px;font-weight:500;padding:5px 13px;border-radius:20px;cursor:pointer;transition:.2s;}
.editbtn:hover{border-color:var(--gold-deep);color:var(--gold);}
.track{height:15px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-soft);overflow:hidden;margin-top:18px;}
.fill{height:100%;border-radius:9px 0 0 9px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));box-shadow:0 0 16px rgba(230,180,90,.5);width:0;transition:width .6s cubic-bezier(.4,0,.2,1);}
.pct{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;font-size:12.5px;color:var(--gold);text-align:center;margin-top:8px;}
.pressure{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:500;flex-wrap:wrap;}
.pressure b{color:var(--text);font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;}
.pressure .sep{color:var(--line);}
.assumed{text-align:center;font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:500;}
.assumed b{color:var(--gold);font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;}
.assumed button{background:none;border:none;color:var(--mint);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0 2px;}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px;}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;transition:.18s;}
.tile:active{transform:scale(.98);}
.tile .tn{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:700;font-size:26px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.tile .tn.g{color:var(--gold);} .tile .tn.m{color:var(--mint);} .tile .tn.r{color:var(--danger);}
.tile .tl{font-size:12px;color:var(--muted);font-weight:500;margin-top:7px;}

/* generic card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px;}
.card-t{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;font-size:15px;}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px;line-height:1.8;}
.empty b{color:var(--text);}

/* list item shell */
.item{background:var(--panel);border:1px solid var(--line-soft);border-radius:15px;padding:14px;margin-top:11px;border-inline-start:4px solid var(--muted);}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.item-name{font-weight:700;font-size:15.5px;}
.item-line{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px;line-height:1.6;}
.item-line b{color:var(--text);font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;}
.gold{color:var(--gold)!important;font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(230,180,90,.15);color:var(--gold);margin-inline-start:6px;}
.due{color:var(--danger);font-weight:700;}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 11px;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.18s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.mini:hover{border-color:var(--gold-deep);color:var(--gold);}
.mini.call{border-color:rgba(95,214,160,.35);color:var(--mint);}
.mini.wa{border-color:rgba(95,214,160,.35);color:var(--mint);}
.mini.go{border-color:rgba(230,180,90,.4);color:var(--gold);}
.mini.del:hover{border-color:var(--danger);color:var(--danger);}
.stage-sel{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.opps{font-size:12px;font-weight:600;color:var(--mint);margin-top:9px;display:flex;align-items:center;gap:5px;}

/* deal pipeline total / verdict */
.pipe-total{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);}
.pipe-total b{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;color:var(--text);}
.verdict{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:500;line-height:1.6;background:rgba(95,214,160,.08);border:1px solid rgba(95,214,160,.22);}
.verdict.short{background:rgba(230,180,90,.08);border-color:rgba(230,180,90,.25);}
.verdict b{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:700;}
.verdict.short b{color:var(--gold);} .verdict.win b{color:var(--mint);}

/* weekly */
.wk-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
.wk-row:last-of-type{border-bottom:none;}
.wk-label{font-size:13.5px;font-weight:500;flex:1;}
.wk-bar{height:5px;flex:1;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:40px;}
.wk-bar i{display:block;height:100%;background:var(--muted);border-radius:4px;transition:.3s;}
.wk-bar i.done{background:var(--mint);}
.wk-val{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;font-size:12.5px;width:50px;text-align:center;font-variant-numeric:tabular-nums;}
.wk-val small{color:var(--muted);font-weight:400;}
.step{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;}
.step:active{background:var(--line);}
.wk-reset{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:12px;font-weight:500;padding:7px 18px;border-radius:20px;cursor:pointer;}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.8;opacity:.85;}

/* due followup mini list (home) */
.fu{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.fu:last-child{border-bottom:none;}
.fu-info{flex:1;min-width:0;}
.fu-name{font-weight:700;font-size:14px;}
.fu-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(12,28,23,.4),var(--ink) 40%);padding-top:6px;}
.nav-inner{max-width:480px;width:100%;display:flex;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:10.5px;font-weight:600;transition:.18s;}
.nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn.on{color:var(--gold);}
.nav-btn.on svg{filter:drop-shadow(0 0 6px rgba(230,180,90,.4));}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,12,9,.74);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:60;}
.overlay.on{display:flex;}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:up .28s cubic-bezier(.2,.8,.2,1);}
@keyframes up{from{transform:translateY(40px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.sheet-t{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;font-weight:600;font-size:17px;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-size:15px;font-weight:500;}
.field textarea{resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-deep);}
.row2{display:flex;gap:10px;}.row2 .field{flex:1;}
.check{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;}
.check input{width:20px;height:20px;accent-color:var(--gold);}
.preview{text-align:center;font-size:13px;color:var(--muted);font-weight:500;margin:4px 0 14px;}
.preview b{font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI','Noto Kufi Arabic',sans-serif;color:var(--gold);font-size:17px;}
.sheet-actions{display:flex;gap:10px;margin-top:6px;}
.sheet-actions button{flex:1;border-radius:12px;padding:13px;font-family:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',sans-serif;font-weight:700;font-size:15px;cursor:pointer;border:none;}
.btn-save{background:var(--gold);color:#1a1207;}
.btn-cancel{background:none;border:1px solid var(--line)!important;color:var(--muted);}
.mstrip{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.mthumb{width:64px;height:64px;border-radius:10px;background-size:cover;background-position:center;background-color:var(--panel-2);flex:none;border:1px solid var(--line);cursor:pointer;}
.mthumb.vid{display:flex;align-items:center;justify-content:center;}
.mthumb.vid span{color:var(--gold);font-size:24px;}
.mini.media{border-color:rgba(111,179,201,.4);color:var(--teal);}
.viewer{align-items:center!important;}
.vwrap{position:relative;width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.vwrap img,.vwrap video{max-width:100%;max-height:74vh;border-radius:14px;background:#000;}
#vClose{position:absolute;top:2px;left:14px;background:rgba(0,0,0,.55);color:#fff;border:none;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;z-index:3;}
#vDel{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:11px;padding:10px 24px;font-family:'Tajawal',system-ui,sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
.tcheck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2);color:var(--mint);font-size:15px;font-weight:700;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.tcheck.on{background:var(--mint);color:#0C1C17;border-color:var(--mint);}
.item.tdone{opacity:.7;}
</style>
</head>
<body>
<div class="app"><div id="screen"></div></div>
<input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">
<div class="overlay viewer" id="viewer"><div class="vwrap"><button id="vClose">✕</button><div id="vContent"></div><button id="vDel">حذف الميديا دي</button></div></div>

<nav class="nav"><div class="nav-inner" id="nav"></div></nav>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-t" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="mCancel">إلغاء</button>
      <button class="btn-save" id="mSave">حفظ</button>
    </div>
  </div>
</div>

<script>
const KEY='omar_broker_app_v1', OLDKEY='omar_million_tracker_v1';
const GOAL=1000000, DEADLINE=new Date('2026-11-01T00:00:00');
const COMPOUNDS=['نيوبوليس','لافينير','أخرى'];
const SOURCES=['إعلانات','جروبات/ماركت','ريفيرال','محتوى/ريلز','والك-إن','أخرى'];
const UNIT_TYPES=['شقة','دوبلكس','بنتهاوس','تاون هاوس','توين هاوس','فيلا'];
const DEAL_STAGES=[
  {id:'lead',label:'عميل مهتم',color:'#86A096'},
  {id:'viewing',label:'معاينة',color:'#6FB3C9'},
  {id:'negotiating',label:'تفاوض',color:'#5FD6A0'},
  {id:'contracted',label:'تعاقد',color:'#C9C26A'},
  {id:'collected',label:'تحصّلت',color:'#E6B45A'},
];
const LEAD_STAGES=[
  {id:'new',label:'جديد',color:'#6FB3C9'},
  {id:'contacted',label:'اتكلمت معاه',color:'#86A096'},
  {id:'viewing',label:'معاينة',color:'#5FD6A0'},
  {id:'negotiating',label:'تفاوض',color:'#C9C26A'},
  {id:'won',label:'اتقفل ✓',color:'#E6B45A'},
  {id:'lost',label:'ضايع',color:'#E07A6B'},
];
const LISTING_STATUS=[
  {id:'available',label:'متاحة',color:'#5FD6A0'},
  {id:'reserved',label:'محجوزة',color:'#C9C26A'},
  {id:'sold',label:'اتباعت',color:'#86A096'},
];
const WEEK_METRICS=[
  {id:'newleads',label:'عملاء جدد',target:20},
  {id:'viewings',label:'معاينات',target:5},
  {id:'listings',label:'ليستنجات جديدة',target:2},
  {id:'reels',label:'ريلز محتوى',target:5},
  {id:'followups',label:'متابعات عملتها',target:25},
];

let state={balance:91000,assumedComm:70000,deals:[],leads:[],listings:[],tasks:[],week:{}};
WEEK_METRICS.forEach(m=>state.week[m.id]=0);
let tab='home', memOnly=false, modalCtx=null;

/* ---------- storage ---------- */
const _mem={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return _mem[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){memOnly=true;_mem[k]=v;}}
async function load(){
  try{
    const r=lsGet(KEY);
    if(r){merge(JSON.parse(r));}
    else{const o=lsGet(OLDKEY);if(o){const s=JSON.parse(o);merge({balance:s.balance,assumedComm:s.assumedComm,deals:s.deals,week:s.week});}}
  }catch(e){}
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){memOnly=true;}
}
function merge(s){
  state.balance=s.balance??state.balance;
  state.assumedComm=s.assumedComm??state.assumedComm;
  state.deals=s.deals||[];
  state.leads=s.leads||[];
  state.listings=s.listings||[];
  state.tasks=s.tasks||[];
  if(s.week)WEEK_METRICS.forEach(m=>state.week[m.id]=s.week[m.id]||0);
}
async function save(){ try{lsSet(KEY,JSON.stringify(state));}catch(e){memOnly=true;} }

/* ---------- helpers ---------- */
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const num=id=>{const v=parseFloat(val(id).replace(/[,\s]/g,''));return isNaN(v)?0:v;};
const todayStr=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const addDays=(s,n)=>{const d=s?new Date(s):new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
function dealComm(d){return Math.round((d.price||0)*(d.pct||0)/100);}
function daysLeft(){return Math.max(0,Math.ceil((DEADLINE-new Date())/86400000));}
function weeksLeft(){return Math.max(1,daysLeft()/7);}
function planComm(){return state.assumedComm||70000;}
function pipelineComm(){return state.deals.reduce((s,d)=>s+dealComm(d),0);}
function dueFollowups(){const t=todayStr();return state.leads.filter(l=>l.nextFollowup&&l.nextFollowup<=t&&l.stage!=='won'&&l.stage!=='lost').sort((a,b)=>(a.nextFollowup||'').localeCompare(b.nextFollowup||''));}
function leadMatches(li){return state.leads.filter(l=>l.stage!=='won'&&l.stage!=='lost'&&l.target===li.compound&&l.budget>=li.price*0.85&&l.budget<=li.price*1.10).length;}
function totalOpps(){return state.listings.filter(x=>x.status==='available').reduce((s,x)=>s+leadMatches(x),0);}
function meta(arr,id){return arr.find(x=>x.id===id)||arr[0];}
function waLink(p){const d=String(p||'').replace(/\D/g,'').replace(/^0/,'');return 'https://wa.me/20'+d;}
function optTags(options,sel){return options.map(o=>{const v=typeof o==='string'?o:o.v,l=typeof o==='string'?o:o.l;return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`;}).join('');}

/* ---------- screens ---------- */
function render(){
  if(tab==='home')renderHome();
  else if(tab==='leads')renderLeads();
  else if(tab==='listings')renderListings();
  else if(tab==='deals')renderDeals();
  else if(tab==='tasks')renderTasks();
  else if(tab==='activity')renderActivity();
  renderNav();
}

function renderHome(){
  const bal=state.balance, pctV=Math.min(100,bal/GOAL*100), gap=Math.max(0,GOAL-bal);
  const due=dueFollowups(), avail=state.listings.filter(x=>x.status==='available').length;
  const s=document.getElementById('screen');
  s.innerHTML=`
    <div class="eyebrow">الهدف · لحد <span>١ نوفمبر ٢٠٢٦</span></div>
    <div class="bignum" id="bignum">${fmt(bal)}<span class="cur">جنيه</span></div>
    <div class="goalline">من <b>1,000,000</b> جنيه في حسابك</div>
    <button class="editbtn" id="editBalance">عدّل رصيدك</button>
    <div class="track"><div class="fill" style="width:${pctV}%"></div></div>
    <div class="pct">${pctV.toFixed(1)}%</div>
    <div class="pressure">
      <span><b>${fmt(daysLeft())}</b> يوم باقي</span><span class="sep">·</span>
      <span>محتاج <b>${fmt(gap/weeksLeft())}</b>/أسبوع</span><span class="sep">·</span>
      <span>≈ <b>${Math.ceil(gap/planComm())}</b> صفقة كمان</span>
    </div>
    <div class="assumed">متوسط عمولة <b>${fmt(planComm())}</b>/صفقة (بيراعي الكو-بروك) · <button id="editAssumed">عدّل</button></div>

    <div class="tiles">
      <div class="tile" data-go="deals"><div class="tn g">${fmt(pipelineComm())}</div><div class="tl">عمولة في الباي-بلاين</div></div>
      <div class="tile" data-go="leads"><div class="tn ${due.length?'r':''}">${due.length}</div><div class="tl">عملاء محتاجين متابعة</div></div>
      <div class="tile" data-go="listings"><div class="tn">${avail}</div><div class="tl">وحداتك المتاحة</div></div>
      <div class="tile" data-go="listings"><div class="tn m">${totalOpps()}</div><div class="tl">فرص double-ending</div></div>
    </div>

    <div class="card">
      <div class="card-t">متابعات النهاردة وفايتة</div>
      ${due.length?due.slice(0,6).map(l=>`
        <div class="fu">
          <div class="fu-info">
            <div class="fu-name">${esc(l.name)}</div>
            <div class="fu-meta"><span class="${l.nextFollowup<todayStr()?'due':''}">📅 ${l.nextFollowup}</span> · ${esc(meta(LEAD_STAGES,l.stage).label)} · ${fmt(l.budget)} ج</div>
          </div>
          ${l.phone?`<a class="mini wa" href="${waLink(l.phone)}" target="_blank">واتس</a>`:''}
          <button class="mini go" data-done="${l.id}">تم ✓</button>
        </div>`).join('')
        :`<div class="empty">مفيش متابعات مستحقة دلوقتي.<br>كل ما تكلّم عميل، حطله <b>تاريخ متابعة جاية</b> عشان ميضيعش منك.</div>`}
    </div>

    ${homeTasksHtml()}
    <div class="note">القاعدة: امسك ليستنجات في نيوبوليس عشان تعمل double-ending وتاخد الطرفين — ده بيضاعف عمولتك.<br>السرعة والمتابعة هما اللي بيقفلوا، مش الفلوس.</div>
    ${memOnly?'<div class="note" style="color:var(--danger)">⚠ الحفظ مش متاح — البيانات هتروح لو قفلت.</div>':''}
  `;
}

function renderLeads(){
  const arr=[...state.leads].sort((a,b)=>{
    const aw=(a.stage==='won'||a.stage==='lost')?1:0, bw=(b.stage==='won'||b.stage==='lost')?1:0;
    if(aw!==bw)return aw-bw;
    return (a.nextFollowup||'9999').localeCompare(b.nextFollowup||'9999');
  });
  document.getElementById('screen').innerHTML=`
    <div class="scr-head"><div><div class="scr-title">العملاء</div><div class="scr-sub">${state.leads.length} عميل · ${dueFollowups().length} محتاج متابعة</div></div>
      <button class="add" data-add="lead">+ عميل</button></div>
    ${arr.length?arr.map(l=>{
      const st=meta(LEAD_STAGES,l.stage), overdue=l.nextFollowup&&l.nextFollowup<todayStr()&&l.stage!=='won'&&l.stage!=='lost';
      return `<div class="item" style="border-inline-start-color:${st.color}">
        <div class="item-top">
          <div><div class="item-name">${esc(l.name)}</div>
            <div class="item-line"><b class="gold">${fmt(l.budget)}</b> ج · بيدوّر على ${esc(l.target)}</div>
            <div class="item-line">المصدر: ${esc(l.source||'-')}${l.nextFollowup?` · متابعة: <span class="${overdue?'due':''}">${l.nextFollowup}</span>`:''}</div>
          </div>
          <span class="chip" style="background:${st.color}22;color:${st.color}">${st.label}</span>
        </div>
        ${l.notes?`<div class="item-line" style="margin-top:8px">📝 ${esc(l.notes)}</div>`:''}
        <div class="actions">
          <select class="stage-sel" data-lstage="${l.id}">${optTags(LEAD_STAGES.map(s=>({v:s.id,l:s.label})),l.stage)}</select>
          ${l.phone?`<a class="mini call" href="tel:${esc(l.phone)}">اتصال</a><a class="mini wa" href="${waLink(l.phone)}" target="_blank">واتساب</a>`:''}
          <button class="mini go" data-tolead="${l.id}">➜ صفقة</button>
          <button class="mini" data-edit-lead="${l.id}">تعديل</button>
          <button class="mini del" data-del-lead="${l.id}">حذف</button>
        </div></div>`;
    }).join('')
    :`<div class="empty">لسه مفيش عملاء.<br>ضيف كل عميل بيكلّمك — مهم جدًا تحطله <b>تاريخ متابعة</b>، ده قلب الشغل.</div>`}
  `;
}

function renderListings(){
  document.getElementById('screen').innerHTML=`
    <div class="scr-head"><div><div class="scr-title">وحداتك</div><div class="scr-sub">${state.listings.length} وحدة · ${totalOpps()} فرصة مطابقة</div></div>

/* ---------- tasks + reminders ---------- */
function taskOverdue(t){return !t.done && t.due && new Date(t.due)<=new Date();}
function pendingTasks(){return state.tasks.filter(t=>!t.done);}
function fmtDue(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return '';const da=String(d.getDate()).padStart(2,'0'),mo=String(d.getMonth()+1).padStart(2,'0');let hh=d.getHours();const mi=String(d.getMinutes()).padStart(2,'0');const ap=hh<12?'\u0635':'\u0645';hh=hh%12||12;return da+'/'+mo+' '+hh+':'+mi+' '+ap;}
function taskLinkName(t){if(!t.linkId)return '';const c=t.linkType==='lead'?state.leads:t.linkType==='listing'?state.listings:state.deals;const it=c.find(x=>x.id===t.linkId);if(!it)return '';const pre=t.linkType==='lead'?'\u0639\u0645\u064a\u0644: ':t.linkType==='listing'?'\u0648\u062d\u062f\u0629: ':'\u0635\u0641\u0642\u0629: ';return pre+(it.name||it.title||'');}
function homeTasksHtml(){if(!state.tasks.length)return '';const od=state.tasks.filter(taskOverdue);const up=state.tasks.filter(t=>!t.done&&t.due&&!taskOverdue(t)).sort((a,b)=>(a.due||'').localeCompare(b.due||''));const list=od.concat(up).slice(0,5);return '<div class="card"><div class="card-t">\u0645\u0647\u0627\u0645\u0643</div>'+(list.length?list.map(t=>`<div class="fu"><div class="fu-info"><div class="fu-name">${esc(t.title)}</div><div class="fu-meta"><span class="${taskOverdue(t)?'due':''}">\u23F0 ${fmtDue(t.due)||'\u0628\u062f\u0648\u0646 \u0648\u0642\u062a'}</span></div></div><button class="mini go" data-task-done="${t.id}">\u062a\u0645 \u2713</button></div>`).join(''):'<div class="empty" style="padding:14px">\u0643\u0644 \u0645\u0647\u0627\u0645\u0643 \u062e\u0644\u0635\u0627\u0646\u0629 \uD83D\uDC4F</div>')+'</div>';}
function renderTasks(){
  const arr=[...state.tasks].sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return (a.due||'9999').localeCompare(b.due||'9999');});
  const ns=('Notification' in window)?Notification.permission:'unsupported';
  document.getElementById('screen').innerHTML=`
    <div class="scr-head"><div><div class="scr-title">\u0627\u0644\u0645\u0647\u0627\u0645</div><div class="scr-sub">${pendingTasks().length} \u0645\u0647\u0645\u0629 \u0645\u0641\u062a\u0648\u062d\u0629 \u00b7 ${state.tasks.filter(taskOverdue).length} \u0645\u062a\u0623\u062e\u0631\u0629</div></div>
      <button class="add" data-add="task">+ \u0645\u0647\u0645\u0629</button></div>
    ${(ns==='granted'||ns==='unsupported')?'':`<button class="mini" id="enableNotif" style="margin-bottom:10px">\uD83D\uDD14 \u0641\u0639\u0651\u0644 \u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a</button>`}
    ${arr.length?arr.map(t=>{const od=taskOverdue(t),ln=taskLinkName(t);
      return `<div class="item ${t.done?'tdone':''}" style="border-inline-start-color:${t.done?'#86A096':od?'#E07A6B':'#6FB3C9'}">
        <div class="item-top"><div style="display:flex;gap:10px;align-items:flex-start;flex:1">
          <button class="tcheck ${t.done?'on':''}" data-task-done="${t.id}">${t.done?'\u2713':''}</button>
          <div><div class="item-name" style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</div>
            ${t.due?`<div class="item-line"><span class="${od?'due':''}">\u23F0 ${fmtDue(t.due)}</span></div>`:''}
            ${ln?`<div class="item-line">\uD83D\uDD17 ${esc(ln)}</div>`:''}
          </div></div></div>
        <div class="actions"><button class="mini" data-edit-task="${t.id}">\u062a\u0639\u062f\u064a\u0644</button><button class="mini del" data-del-task="${t.id}">\u062d\u0630\u0641</button></div>
      </div>`;}).join('')
    :`<div class="empty">\u0645\u0641\u064a\u0634 \u0645\u0647\u0627\u0645.<br>\u0636\u064a\u0641 \u062d\u0627\u062c\u0629 \u0645\u062d\u062a\u0627\u062c \u062a\u0639\u0645\u0644\u0647\u0627 (\u062a\u0643\u0644\u0651\u0645 \u0645\u0627\u0644\u0643\u060c \u062a\u062a\u0627\u0628\u0639 \u0639\u0645\u064a\u0644\u060c \u0645\u0639\u0627\u064a\u0646\u0629) \u0648\u062d\u0637\u0644\u0647\u0627 \u0648\u0642\u062a \u062a\u062a\u0630\u0643\u0651\u0631 \u0628\u064a\u0647.</div>`}
    <div class="note">\u0627\u0644\u062a\u0646\u0628\u064a\u0647 \u0628\u064a\u0638\u0647\u0631 \u0644\u0645\u0627 \u062a\u0641\u062a\u062d \u0627\u0644\u062a\u0637\u0628\u064a\u0642. \u0644\u0644\u0645\u0648\u0627\u0639\u064a\u062f \u0627\u0644\u0645\u0647\u0645\u0629 \u062c\u062f\u064b\u0627\u060c \u0627\u0644\u0623\u0641\u0636\u0644 \u062a\u062b\u0628\u0651\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0645\u0646 \u0644\u064a\u0646\u0643 \u0639\u0634\u0627\u0646 \u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a \u062a\u0634\u062a\u063a\u0644 \u0623\u0642\u0648\u0649.</div>
  `;
}
function requestNotif(){try{if('Notification' in window){Notification.requestPermission().then(p=>{render();if(p==='granted')checkReminders();});}}catch(e){}}
function checkReminders(){try{if(!('Notification' in window)||Notification.permission!=='granted')return;let ch=false;const now=new Date();state.tasks.forEach(t=>{if(!t.done&&t.due&&!t.notified&&new Date(t.due)<=now){try{new Notification('\u062a\u0630\u0643\u064a\u0631: '+t.title,{body:fmtDue(t.due)});}catch(e){}t.notified=true;ch=true;}});if(ch)save();}catch(e){}}
document.body.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};
  if(ds.taskDone){const tk=state.tasks.find(x=>x.id===ds.taskDone);if(tk){tk.done=!tk.done;await save();render();}return;}
  if(ds.editTask){openModal('task',ds.editTask);return;}
  if(ds.delTask){if(confirm('\u062a\u062d\u0630\u0641 \u0627\u0644\u0645\u0647\u0645\u0629 \u062f\u064a\u061f')){state.tasks=state.tasks.filter(x=>x.id!==ds.delTask);await save();render();}return;}
  if(t.id==='enableNotif'){requestNotif();return;}
});

function openModal(type,id,preset){
  modalCtx={type,id};
  const _coll= type==='lead'?state.leads : type==='listing'?state.listings : type==='task'?state.tasks : state.deals;
  const d= id ? _coll.find(x=>x.id===id) : (preset||null);
  const titles={lead:id?'تعديل عميل':'عميل جديد',listing:id?'تعديل وحدة':'وحدة جديدة',deal:id?'تعديل صفقة':'صفقة جديدة',task:id?'تعديل مهمة':'مهمة جديدة'};
  document.getElementById('modalTitle').textContent=titles[type];
  document.getElementById('modalBody').innerHTML=formHTML(type,d);
  if(type==='deal'){
    const upd=()=>{const p=num('m_price'),pc=parseFloat(val('m_pct'))||0;document.getElementById('m_preview').textContent=fmt(p*pc/100);};
    document.getElementById('m_price').oninput=upd;document.getElementById('m_pct').oninput=upd;
    document.getElementById('m_dtype').onchange=e=>{if(e.target.value){document.getElementById('m_pct').value=e.target.value;upd();}};
    upd();
  }
  document.getElementById('overlay').classList.add('on');
}
function closeModal(){document.getElementById('overlay').classList.remove('on');modalCtx=null;}

async function saveModal(){
  const t=modalCtx.type;let coll,obj;
  if(t==='lead'){
    if(!val('m_name')){alert('اكتب اسم العميل');return;}
    coll='leads';obj={name:val('m_name'),phone:val('m_phone'),budget:num('m_budget'),target:val('m_target'),source:val('m_source'),stage:val('m_stage'),nextFollowup:val('m_follow'),notes:val('m_notes')};
  }else if(t==='listing'){
    if(!val('m_title')){alert('اكتب وصف الوحدة');return;}
    coll='listings';obj={title:val('m_title'),compound:val('m_compound'),type:val('m_type'),price:num('m_price'),area:num('m_area'),owner:val('m_owner'),ownerPhone:val('m_ownerPhone'),status:val('m_status'),exclusive:document.getElementById('m_excl').checked};
  }else if(t==='task'){
    if(!val('m_title')){alert('اكتب المهمة');return;}
    coll='tasks';const lk=val('m_link');let lt='none',lid='';if(lk){const i=lk.indexOf(':');lt=lk.slice(0,i);lid=lk.slice(i+1);}
    const ex=modalCtx.id?state.tasks.find(x=>x.id===modalCtx.id):null;
    obj={title:val('m_title'),due:val('m_due'),linkType:lt,linkId:lid,done:ex?ex.done:false,notified:false};
  }else{
    if(!val('m_name')){alert('اكتب اسم الصفقة');return;}
    if(num('m_price')<=0){alert('اكتب سعر الوحدة');return;}
    coll='deals';obj={name:val('m_name'),comp:val('m_comp'),price:num('m_price'),pct:parseFloat(val('m_pct'))||2,stage:val('m_stage'),date:val('m_date')};
  }
  if(modalCtx.id){Object.assign(state[coll].find(x=>x.id===modalCtx.id),obj);}
  else{obj.id='x'+Date.now()+Math.random().toString(36).slice(2,6);state[coll].unshift(obj);}
  closeModal();await save();render();
}

/* ---------- global events ---------- */
document.getElementById('mCancel').onclick=closeModal;
document.getElementById('mSave').onclick=saveModal;
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};

document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0);}};

document.body.addEventListener('click',async e=>{
  const t=e.target, ds=t.dataset||{};
  // nav tiles
  const go=t.closest('[data-go]'); if(go){tab=go.dataset.go;render();window.scrollTo(0,0);return;}
  // add buttons
  const add=t.closest('[data-add]'); if(add){openModal(add.dataset.add,null);return;}
  // edits
  if(ds.editLead){openModal('lead',ds.editLead);return;}
  if(ds.editListing){openModal('listing',ds.editListing);return;}
  if(ds.editDeal){openModal('deal',ds.editDeal);return;}
  // deletes
  if(ds.delLead){if(confirm('تحذف العميل ده؟')){state.leads=state.leads.filter(x=>x.id!==ds.delLead);await save();render();}return;}
  if(ds.delListing){if(confirm('تحذف الوحدة دي؟ (هتتمسح صورها وفيديوهاتها كمان)')){const lid=ds.delListing;for(const mm of media.filter(x=>x.listingId===lid)){try{await idbDel(mm.id);}catch(e){}if(mm.url)URL.revokeObjectURL(mm.url);}media=media.filter(x=>x.listingId!==lid);state.listings=state.listings.filter(x=>x.id!==lid);await save();render();updateStorage();}return;}
  if(ds.delDeal){if(confirm('تحذف الصفقة دي؟')){state.deals=state.deals.filter(x=>x.id!==ds.delDeal);await save();render();}return;}
  // bank a deal
  if(ds.bank){const d=state.deals.find(x=>x.id===ds.bank);if(d&&confirm(`تحوّل عمولة «${d.name}» (${fmt(dealComm(d))} ج) لرصيدك؟`)){state.balance+=dealComm(d);state.deals=state.deals.filter(x=>x.id!==ds.bank);await save();render();const bn=document.getElementById('bignum');if(bn){bn.classList.add('pulse');setTimeout(()=>bn.classList.remove('pulse'),360);}}return;}
  // convert lead -> deal
  if(ds.tolead){const l=state.leads.find(x=>x.id===ds.tolead);if(l){openModal('deal',null,{name:l.name,comp:(COMPOUNDS.includes(l.target)?l.target:'نيوبوليس'),price:l.budget,pct:2,stage:'negotiating',date:''});}return;}
  // followup done (home)
  if(ds.done){const l=state.leads.find(x=>x.id===ds.done);if(l){l.nextFollowup=addDays(todayStr(),3);state.week.followups=(state.week.followups||0)+1;await save();render();}return;}
  // edit balance / assumed
  if(t.id==='editBalance'){const v=prompt('رصيدك الحالي في البنك (جنيه):',state.balance);if(v!==null){const n=parseFloat(String(v).replace(/[,\s]/g,''));if(!isNaN(n)&&n>=0){state.balance=n;await save();render();}}return;}
  if(t.id==='editAssumed'){const v=prompt('متوسط العمولة المتوقع للصفقة (جنيه) — وسّطها بين الطرفين والكو-بروك:',state.assumedComm);if(v!==null){const n=parseFloat(String(v).replace(/[,\s]/g,''));if(!isNaN(n)&&n>0){state.assumedComm=n;await save();render();}}return;}
  // weekly steps
  if(ds.inc){state.week[ds.inc]=(state.week[ds.inc]||0)+1;await save();render();return;}
  if(ds.dec){state.week[ds.dec]=Math.max(0,(state.week[ds.dec]||0)-1);await save();render();return;}
  if(t.id==='resetWeek'){if(confirm('تصفير عدّادات الأسبوع؟')){WEEK_METRICS.forEach(m=>state.week[m.id]=0);await save();render();}return;}
});

// stage dropdown changes
document.body.addEventListener('change',async e=>{
  const ds=e.target.dataset||{};
  if(ds.lstage){const l=state.leads.find(x=>x.id===ds.lstage);if(l){l.stage=e.target.value;await save();render();}}
  if(ds.dstage){const d=state.deals.find(x=>x.id===ds.dstage);if(d){d.stage=e.target.value;await save();render();}}
});

/* boot */
/* ---------- media (IndexedDB: photos + videos on device) ---------- */
let db=null, media=[], mediaTargetListing=null, currentView=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('brokerMedia',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);});}
function idbAll(){return new Promise((res,rej)=>{const rq=db.transaction('media','readonly').objectStore('media').getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});}
function idbPut(rec){return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function idbDel(id){return new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function loadMedia(){try{db=await openDB();const all=await idbAll();all.forEach(m=>{try{m.url=URL.createObjectURL(m.blob);}catch(e){}});media=all;}catch(e){db=null;}}
function mediaStrip(id){const items=media.filter(m=>m.listingId===id);if(!items.length)return '';return '<div class="mstrip">'+items.map(m=>m.kind==='video'?`<div class="mthumb vid" data-view="${m.id}"><span>\u25B6</span></div>`:`<div class="mthumb" data-view="${m.id}" style="background-image:url('${m.url}')"></div>`).join('')+'</div>';}
function openViewer(id){const m=media.find(x=>x.id===id);if(!m)return;currentView=id;document.getElementById('vContent').innerHTML=m.kind==='video'?`<video src="${m.url}" controls autoplay playsinline></video>`:`<img src="${m.url}">`;document.getElementById('viewer').classList.add('on');}
function closeViewer(){const v=document.getElementById('viewer');if(v)v.classList.remove('on');const c=document.getElementById('vContent');if(c)c.innerHTML='';currentView=null;}
async function delMedia(id){const m=media.find(x=>x.id===id);if(!m)return;if(!confirm('\u062a\u062d\u0630\u0641 \u0627\u0644\u0645\u064a\u062f\u064a\u0627 \u062f\u064a\u061f'))return;try{await idbDel(id);}catch(e){}if(m.url)URL.revokeObjectURL(m.url);media=media.filter(x=>x.id!==id);closeViewer();render();updateStorage();}
async function initStorage(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}}
async function updateStorage(){const el=document.getElementById('storehint');if(!el)return;try{const est=await navigator.storage.estimate();const mb=(est.usage/1048576).toFixed(1);el.textContent='\uD83D\uDCBE \u0645\u0633\u0627\u062d\u0629 \u0645\u0633\u062a\u062e\u062f\u0645\u0629 \u0639\u0644\u0649 \u062c\u0647\u0627\u0632\u0643: '+mb+' \u0645\u064a\u062c\u0627 \u00b7 \u0627\u0644\u0635\u0648\u0631 \u0648\u0627\u0644\u0641\u064a\u062f\u064a\u0648 \u0645\u062d\u0641\u0648\u0638\u0629 \u0645\u062d\u0644\u064a\u064b\u0627';}catch(e){el.textContent='\u0627\u0644\u0635\u0648\u0631 \u0648\u0627\u0644\u0641\u064a\u062f\u064a\u0648 \u0645\u062d\u0641\u0648\u0638\u0629 \u0639\u0644\u0649 \u062c\u0647\u0627\u0632\u0643';}}
document.getElementById('mediaInput').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;if(!db||!mediaTargetListing){alert('\u062a\u062e\u0632\u064a\u0646 \u0627\u0644\u0645\u064a\u062f\u064a\u0627 \u0645\u0634 \u0645\u062a\u0627\u062d \u0641\u064a \u0627\u0644\u0648\u0636\u0639 \u062f\u0647. \u0627\u0641\u062a\u062d \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0645\u0646 \u0627\u0644\u0646\u0633\u062e\u0629 \u0627\u0644\u0645\u062b\u0628\u0651\u062a\u0629 \u0639\u0644\u0649 \u0627\u0644\u0645\u0648\u0628\u0627\u064a\u0644.');return;}for(const fl of files){const rec={id:'md'+Date.now()+Math.random().toString(36).slice(2,6),listingId:mediaTargetListing,kind:fl.type.indexOf('video')===0?'video':'image',name:fl.name,blob:fl};try{await idbPut(rec);rec.url=URL.createObjectURL(fl);media.push(rec);}catch(err){alert('\u0645\u0641\u064a\u0634 \u0645\u0633\u0627\u062d\u0629 \u0643\u0627\u0641\u064a\u0629 \u0639\u0644\u0649 \u0627\u0644\u062c\u0647\u0627\u0632 \u0623\u0648 \u062d\u0635\u0644 \u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u062d\u0641\u0638.');break;}}e.target.value='';render();updateStorage();};
document.body.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(ds.addmedia){mediaTargetListing=ds.addmedia;const mi=document.getElementById('mediaInput');mi.value='';mi.click();return;}const vt=t.closest&&t.closest('[data-view]');if(vt){openViewer(vt.dataset.view);return;}if(t.id==='vClose'||t.id==='viewer'){closeViewer();return;}if(t.id==='vDel'){if(currentView)delMedia(currentView);return;}});
(async()=>{await load();await loadMedia();await initStorage();render();updateStorage();checkReminders();setInterval(checkReminders,30000);})();
</script>
